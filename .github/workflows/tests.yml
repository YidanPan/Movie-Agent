name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare and evaluate Golden Film plan evidence
        run: |
          python -m evals.prepare_golden --mode mock --projects-dir .ci/golden-projects
          python evals/evaluate.py --projects-dir .ci/golden-projects --outputs-dir .ci/eval-report --require-plan-evidence
